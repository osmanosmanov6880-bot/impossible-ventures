name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and execute integration tests
        run: npm run check
      - name: Build portable static preview (no pilot backend)
        run: python3 scripts/build_static_preview.py
      - name: Validate static entrypoints and metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Validator(HTMLParser):
              pass
          files = [
              'index.html',
              'privacy.html',
              'apps/status/index.html',
              'apps/dead-drop/index.html',
              'apps/appeal-2049/index.html',
              'apps/appeal-2049-studio/index.html',
              'apps/antipersona/index.html',
              'apps/brief-theatre-studio/index.html',
              'apps/adbiome/index.html',
              'apps/museum-of-attention-studio/index.html',
              'apps/attention-republic-live/index.html',
              'apps/attention-republic-live/operator.html',
              'apps/pipeline/index.html',
              'apps/economics/index.html',
              'apps/pilot-studio/index.html',
              'apps/pilot-studio/operator.html',
              'apps/experiment-lab/index.html',
              'apps/experiment-lab/operator.html',
              'apps/commercial/index.html',
              'apps/commercial/showcase.html',
              'apps/commercial/proposal.html',
              'apps/anti-persona/index.html',
              'apps/brief-theatre/index.html',
              'apps/ad-biome/index.html',
              'apps/museum-of-attention/index.html',
              'apps/attention-republic/index.html',
              'apps/cinema/index.html',
              'apps/cinema/prototype/index.html',
          ]
          for filename in files:
              path = Path(filename)
              assert path.is_file(), filename
              text = path.read_text(encoding='utf-8')
              assert '<!doctype html>' in text.lower(), filename
              assert '<title>' in text, filename
              assert 'name="viewport"' in text, filename
              Validator().feed(text)
              print('PASS', filename)
          PY
