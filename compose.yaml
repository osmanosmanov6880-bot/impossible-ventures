services:
  impossible-ventures:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DB_PATH: /data/missions.sqlite
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
    volumes:
      - mission-data:/data
    restart: unless-stopped

volumes:
  mission-data:
